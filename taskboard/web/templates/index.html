<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>TaskBoard</h1>
    <p id="status">Loading…</p>
  </header>
  <main>
    <p id="error" role="alert" hidden></p>

    <section aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <label for="project-select">Project</label>
      <select id="project-select" name="project">
        <option value="">Select a project</option>
      </select>
      <form id="project-form">
        <label for="project-name">New project name</label>
        <input id="project-name" name="name" type="text" required>
        <button id="project-submit" type="submit">Create project</button>
      </form>
    </section>

    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Tasks</h2>
      <form id="task-form">
        <label for="task-title">Title</label>
        <input id="task-title" name="title" type="text" required>
        <label for="task-description">Description</label>
        <textarea id="task-description" name="description"></textarea>
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="priority">
          <option value="low">low</option>
          <option value="medium" selected>medium</option>
          <option value="high">high</option>
        </select>
        <button id="task-submit" type="submit">Add task</button>
      </form>

      <div class="filters">
        <div>
          <label for="status-filter">Status</label>
          <select id="status-filter" name="status">
            <option value="all">all</option>
            <option value="todo">todo</option>
            <option value="doing">doing</option>
            <option value="done">done</option>
          </select>
        </div>
        <div>
          <label for="priority-filter">Priority</label>
          <select id="priority-filter" name="priority">
            <option value="all">all</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
          </select>
        </div>
      </div>
    </section>

    <div class="board" id="board">
      <section class="column" aria-labelledby="col-todo"><h3 id="col-todo">To do</h3><div data-column="todo"></div></section>
      <section class="column" aria-labelledby="col-doing"><h3 id="col-doing">Doing</h3><div data-column="doing"></div></section>
      <section class="column" aria-labelledby="col-done"><h3 id="col-done">Done</h3><div data-column="done"></div></section>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
