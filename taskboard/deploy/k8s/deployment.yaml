apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  labels:
    app: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard
  template:
    metadata:
      labels:
        app: taskboard
    spec:
      containers:
        - name: taskboard
          image: taskboard:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TASKBOARD_DB_DRIVER
              value: postgres
            - name: TASKBOARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskboard-db
                  key: database-url
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20